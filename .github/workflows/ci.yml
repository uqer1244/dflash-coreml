name: Preview checks
on: [push, pull_request]
jobs:
  protocol:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: ./native/build.sh
      # Hardware/model parity requires external weights; it is not claimed by this CI.
